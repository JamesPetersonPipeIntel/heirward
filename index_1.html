<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Heirward Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: marketing page with sticky header; app = sidebar + main workspace that stacks on phones. Coastal jade identity. */
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --surface-2: #E9EEEC; --fg: #1A2329; --muted: #4B5A60; --line: #D3DBD8;
  --jade: #0F5C55; --jade-ink: #0B4741; --mint: #8FD3C1; --mint-soft: #DDF2EC; --slate: #22303A;
  --btn-bg: #0F5C55; --btn-fg: #FFFFFF; --link: #0F5C55; --hero-bg: #22303A; --hero-fg: #FFFFFF; --hero-muted: #C3CED2;
  --ok-bg: #DDF2EC; --ok-fg: #0B4741; --warn-bg: #FBEFD6; --warn-fg: #7A4F00; --bad-bg: #F8E1DF; --bad-fg: #9A2E28; --idle-bg: #E9EEEC; --idle-fg: #34444A;
  --mark-bg: #0F5C55; --mark-post: #FFFFFF; --mark-bar: #8FD3C1;
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px; --r-lg: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181D; --surface: #1A2329; --surface-2: #22303A; --fg: #E8EEEC; --muted: #A9B6B9; --line: #33444D;
  --jade: #4FB3A2; --jade-ink: #9FE0CF; --mint: #8FD3C1; --mint-soft: #1E3B37; --slate: #0D1418;
  --btn-bg: #8FD3C1; --btn-fg: #0F2E2B; --link: #8FD3C1; --hero-bg: #0D1418; --hero-fg: #F2F5F4; --hero-muted: #A9B6B9;
  --ok-bg: #1E3B37; --ok-fg: #9FE0CF; --warn-bg: #3B2F14; --warn-fg: #F2C46D; --bad-bg: #3D1E1B; --bad-fg: #F29B8C; --idle-bg: #2A3740; --idle-fg: #C3CED2;
  --mark-bg: #8FD3C1; --mark-post: #0F2E2B; --mark-bar: #0F5C55; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11181D; --surface: #1A2329; --surface-2: #22303A; --fg: #E8EEEC; --muted: #A9B6B9; --line: #33444D;
  --jade: #4FB3A2; --jade-ink: #9FE0CF; --mint: #8FD3C1; --mint-soft: #1E3B37; --slate: #0D1418;
  --btn-bg: #8FD3C1; --btn-fg: #0F2E2B; --link: #8FD3C1; --hero-bg: #0D1418; --hero-fg: #F2F5F4; --hero-muted: #A9B6B9;
  --ok-bg: #1E3B37; --ok-fg: #9FE0CF; --warn-bg: #3B2F14; --warn-fg: #F2C46D; --bad-bg: #3D1E1B; --bad-fg: #F29B8C; --idle-bg: #2A3740; --idle-fg: #C3CED2;
  --mark-bg: #8FD3C1; --mark-post: #0F2E2B; --mark-bar: #0F5C55; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.02em }
p { margin: 0 }
a { color: var(--link) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1200px; margin: 0 auto }
.tnum { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 13px }
.hidden-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r); border: 1.5px solid transparent; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; background: var(--btn-bg); color: var(--btn-fg) }
.btn:hover { filter: brightness(1.08) }
.btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line) }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px }
.btn.danger { background: var(--bad-bg); color: var(--bad-fg) }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--link); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap }
.pill.done { background: var(--ok-bg); color: var(--ok-fg) }
.pill.soon { background: var(--warn-bg); color: var(--warn-fg) }
.pill.overdue { background: var(--bad-bg); color: var(--bad-fg) }
.pill.upcoming { background: var(--idle-bg); color: var(--idle-fg) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.spread { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted) }
.list { display: flex; flex-direction: column }
.list > * { border-top: 1px solid var(--line); padding-block: 12px }
.list > *:first-child { border-top: 0 }
.field { display: flex; flex-direction: column; gap: 6px }
.field label, .field legend { font-size: 14px; font-weight: 700 }
.field input, .field select, .field textarea { min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); width: 100% }
.field textarea { min-height: 96px; resize: vertical }
.check { display: flex; gap: 10px; align-items: center; min-height: 32px }
.check input { width: 20px; height: 20px; accent-color: var(--jade) }

/* Marketing */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.site-header .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-block: 14px }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.03em; color: var(--fg); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer }
.nav { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center }
.nav button.plain { background: none; border: 0; padding: 8px 0; cursor: pointer; font-weight: 600 }
.hero { background: var(--hero-bg); color: var(--hero-fg) }
.hero .wrap { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; padding-block: 72px }
.hero h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.06; font-weight: 800; letter-spacing: -0.035em; max-width: 14ch }
.hero p.lead { font-size: 19px; color: var(--hero-muted); max-width: 52ch }
.hero .copy { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px }
.hero .eyebrow { color: var(--mint) }
.hero .btn.ghost { background: transparent; color: var(--hero-fg); border-color: #5E6E78 }
.preview { flex: 1 1 420px; min-width: 0; background: var(--surface); color: var(--fg); border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25) }
.section { padding-block: 64px }
.section h2 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800 }
.section .intro { max-width: 62ch; color: var(--muted); font-size: 17px }
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px }
.stages li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 6px }
.stages .n { font-weight: 800; color: var(--jade) }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px }
.stat { font-size: 36px; font-weight: 800; color: var(--jade); letter-spacing: -0.03em }
.band { background: var(--surface); border-block: 1px solid var(--line) }
.footer { background: var(--hero-bg); color: var(--hero-muted) }
.footer .wrap { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; padding-block: 32px }

/* App */
.app { display: flex; flex-wrap: wrap; min-height: 100vh; align-items: stretch }
.side { flex: 1 1 230px; max-width: 260px; background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; display: flex; flex-direction: column; gap: 4px }
.side .navlink { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: var(--r); background: none; border: 0; text-align: left; cursor: pointer; font-weight: 600; width: 100% }
.side .navlink[aria-current="page"] { background: var(--mint-soft); color: var(--jade-ink); font-weight: 800 }
.side .navlink .count { font-size: 12px; font-weight: 700; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 99px; background: var(--bad-bg); color: var(--bad-fg) }
.main { flex: 999 1 560px; min-width: 0; padding-block: 28px; display: flex; flex-direction: column; gap: 22px }
.pagehead h1 { font-size: 30px; font-weight: 800 }
.cols { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start }
.cols > .wide { flex: 3 1 440px; min-width: 0 }
.cols > .narrow { flex: 2 1 300px; min-width: 0 }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px }
.tile { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface) }
.taskrow { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center }
.taskrow .t { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.taskrow button.t { background: none; border: 0; text-align: left; cursor: pointer; padding: 0 }
.taskrow.selected { background: var(--mint-soft); margin-inline: -12px; padding-inline: 12px; border-radius: var(--r) }
.month { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 18px }
.mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px }
.node { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; background: var(--surface) }
.matrix th.grp { text-align: center; border-bottom: 1px solid var(--line) }
.matrix th.party { text-align: center; vertical-align: bottom; min-width: 96px; font-size: 12px; text-transform: none; letter-spacing: 0 }
.matrix th.party .small { display: block; font-weight: 500 }
.matrix th.docname { text-align: left; font-weight: 400; min-width: 220px; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--fg) }
.matrix th.docname .small { font-size: 13px; color: var(--muted) }
.matrix th.docname strong, .matrix th.docname .small { display: block }
.matrix td.tick { text-align: center }
.matrix td.tick span { color: var(--jade); font-weight: 800 }
.matrix td.tick input { width: 20px; height: 20px; accent-color: var(--jade); cursor: pointer }
.matrix .gs { border-left: 1px solid var(--line) }
.roles4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px }
.card.role ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; flex: 1 }
.card.role li { font-size: 14px; line-height: 1.45 }
.card.role .linkbtn { align-self: flex-start }
.modal.wide { max-width: 720px }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 700; cursor: pointer; color: var(--muted); white-space: nowrap }
.tab[aria-selected="true"] { color: var(--jade-ink); border-bottom-color: var(--jade) }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; margin: 0 }
.facts dt { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted) }
.facts dd { margin: 2px 0 0; font-weight: 600 }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px }
.gstset { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; margin: 0; display: flex; flex-direction: column; gap: 12px }
.gstset legend { font-weight: 800; padding: 0 6px }
table.journal tbody.jgroup tr td { border-top: 0; padding-block: 4px }
table.journal tbody.jgroup tr.jhead td { border-top: 1px solid var(--line); padding-top: 12px }
td.cracct { padding-left: 28px }
table.jl td { border-top: 0; padding: 4px }
table.jl select, table.jl input { width: 100%; min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table.jl td:first-child { min-width: 220px }
table.jl td:not(:first-child) { min-width: 110px }
button.plainrow { background: none; border: 0; text-align: left; cursor: pointer; width: 100%; font: inherit; color: inherit }
.wfgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px }
.wfdoes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; flex: 1 }
.wfsteps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px }
.wfsteps li > strong { display: block; font-size: 14px }
.wfsteps .tablewrap { margin-top: 6px }
.wfmsg { font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: var(--r); margin: 0 0 8px }
.wfmsg.bad { background: var(--bad-bg); color: var(--bad-fg) }
.wfmsg.warn { background: var(--warn-bg); color: var(--warn-fg) }
.node.flag { border-color: var(--bad-fg) }
.core { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px }
pre.minutes { white-space: pre-wrap; font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 14px; border-radius: var(--r); margin: 0; max-height: 360px; overflow: auto }
.savebadge { font-size: 12px; font-weight: 700; padding: 6px 12px; margin-inline: 12px; border-radius: 99px; background: var(--surface-2); color: var(--muted); align-self: flex-start }
.demo-note { background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: var(--r) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--slate); color: #FFFFFF; padding: 12px 18px; border-radius: var(--r); font-weight: 600; z-index: 30; max-width: calc(100% - 32px) }
.modal-back { position: fixed; inset: 0; background: rgba(13,20,24,.55); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--surface); border-radius: var(--r-lg); width: 100%; max-width: 560px; padding: 24px; display: flex; flex-direction: column; gap: 16px }
.modal fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0; display: flex; flex-direction: column; gap: 6px }
.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-top: 0 }

.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
tr.total td { font-weight: 800; border-top: 2px solid var(--fg) }
tr.sub td { font-weight: 700 }
td.indent { padding-left: 22px }
.statement { display: flex; flex-direction: column; gap: 6px }
.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--mint-soft); color: var(--jade-ink); padding: 12px 16px; border-radius: var(--r-lg); font-weight: 600 }
.side .navlink .count.soft { background: var(--warn-bg); color: var(--warn-fg) }
.logday { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 16px }
.logrow { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline }
.logrow .time { width: 64px; font-size: 13px; color: var(--muted) }
.logrow .what { flex: 1 1 260px; min-width: 0 }
@media (max-width: 760px) {
  .side { max-width: none; flex-basis: 100%; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px }
  .side .navlink { width: auto }
  .side .sidebrand { flex-basis: 100% }
  .hero .wrap { padding-block: 48px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
body { margin: 0 }
</style>
</head>

<script src="config.js"></script>
<script>
/* Heirward storage layer for static hosting.
   - If HEIRWARD_CONFIG has a Supabase URL and anon key: sign-in by email link, saving to Postgres, private file storage.
   - Otherwise: saving to this browser only (localStorage) and no file uploads.
   The anon key is meant to be public; row level security in schema.sql is what protects the data. */
window.HEIRWARD_CONFIG = window.HEIRWARD_CONFIG || { supabaseUrl: "", supabaseAnonKey: "" };
(function () {
  var cfg = window.HEIRWARD_CONFIG, configured = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);
  var hw = window.__hw = {
    configured: configured, ready: !configured, failed: false, user: null,
    label: configured ? "Saved to your account" : "Saved in this browser",
    notes: configured ? {
      chart: "Saved to your account: the chart of accounts as one record per trust, and the journals as one record per trust year.",
      start: "Your trust is saved to your account and is private to you. Use the Manage page to download a backup.",
      live: "Your private workspace. Trusts, decisions and accounts are saved to your account, and attached files are kept in private storage."
    } : {
      chart: "Saved in this browser only: the chart of accounts as one record per trust, and the journals as one record per trust year.",
      start: "In this version your trust is saved in this browser only, on this device. Clearing site data deletes it. Use sample details, and don't enter IRD numbers.",
      live: "Your workspace is saved in this browser only, on this device. Clearing site data deletes it. Please use sample details and don't enter IRD numbers."
    }
  };

  /* ---- downloads: ordinary browser downloads ---- */
  var downloads = { save: function (o) { return new Promise(function (resolve, reject) {
    try { var blob = o.data instanceof Blob ? o.data : new Blob([o.data]); var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); resolve({ status: "saved" }); }
    catch (e) { reject({ code: "unavailable", message: String(e) }); } }); } };

  /* ---- local mode: localStorage ---- */
  var mem = {};
  function ls() { try { return window.localStorage; } catch (e) { return null; } }
  function lget(k) { var s = ls(); try { var v = s ? s.getItem("heirward:" + k) : mem[k]; return v == null ? null : v; } catch (e) { return mem[k] == null ? null : mem[k]; } }
  function lput(k, v) { var s = ls(); try { if (s) s.setItem("heirward:" + k, v); else mem[k] = v; } catch (e) { mem[k] = v; throw e; } }
  function ldel(k) { var s = ls(); try { if (s) s.removeItem("heirward:" + k); } catch (e) {} delete mem[k]; }
  function lkeys(prefix) { var out = [], s = ls(); try { if (s) for (var i = 0; i < s.length; i++) { var k = s.key(i); if (k.indexOf("heirward:" + prefix) === 0) out.push(k.slice(9)); } } catch (e) {} Object.keys(mem).forEach(function (k) { if (k.indexOf(prefix) === 0 && out.indexOf(k) < 0) out.push(k); }); return out; }
  function ldoc(path) { return {
    get: function () { var v = lget(path); return Promise.resolve({ exists: v !== null, data: function () { return v === null ? undefined : JSON.parse(v); } }); },
    set: function (d) { try { lput(path, JSON.stringify(d)); return Promise.resolve(); } catch (e) { return Promise.reject(e); } },
    delete: function () { ldel(path); return Promise.resolve(); },
    collection: function (n) { return lcoll(path + "/" + n); } }; }
  function lcoll(path) { return {
    doc: function (id) { return ldoc(path + "/" + id); },
    get: function () { var docs = lkeys(path + "/").filter(function (k) { return k.slice(path.length + 1).indexOf("/") < 0; }).map(function (k) { var v = lget(k); return { data: function () { return JSON.parse(v); } }; }); return Promise.resolve({ docs: docs }); } }; }

  /* ---- Supabase mode ---- */
  var sb = null, BUCKET = "trust-files";
  function loadLib() { return new Promise(function (res, rej) {
    if (window.supabase && window.supabase.createClient) return res();
    var s = document.createElement("script"); s.src = cfg.libUrl || "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  var sbReady = !configured ? Promise.resolve() : loadLib().then(function () {
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    return sb.auth.getSession();
  }).then(function (r) {
    hw.user = r && r.data && r.data.session ? r.data.session.user : null; hw.ready = true;
    sb.auth.onAuthStateChange(function (ev, session) {
      var u = session ? session.user : null, changed = (u && u.id) !== (hw.user && hw.user.id); hw.user = u;

function crc32(u8) {

/* converting the earlier single-entry beta data */
function convertLegacy(tr) {
  tr.accounts = defaultAccounts(); tr.journals = []; tr.ledgerSeq = 0;

  let bankUsed = false;
  const P = (j) => { try { post(tr, j); } catch (e) { /* skip entries that can't balance */ } };

    const sub = catSub[x.category] || "other"; let acc;

    const sub = x.category === "Settlor loan" ? "settlor" : /mortgage|loan/i.test(x.category || "") ? "loan" : "other";
    const acc = A(nextCode(tr, "liability", sub), x.name, "liability", sub, "NONE"); acc.id = x.id; acc.note = x.note || ""; tr.accounts.push(acc);

  });

  const code = (c) => (tr.accounts.find((a) => a.code === c) || {}).id;
  const incAcct = (cat) => code({ Interest: "4000", Dividends: "4100", Rent: "4200" }[cat] || "4300");
  const expAcct = (cat) => (tr.accounts.find((a) => a.type === "expense" && a.name.toLowerCase() === String(cat || "").toLowerCase()) || {}).id || code("6090");
  (tr.ledger || []).forEach((x) => {
    const g = C(Math.abs(Number(x.amount) || 0)), date = x.date, memo = x.description || "", acc = x.account || bank();

    else if (x.type === "adjustment") P({ date, memo, kind: "adjust", lines: up ? [{ a: acc, dr: g }, { a: sysAcct(tr, "recon").id, cr: g }] : [{ a: sysAcct(tr, "recon").id, dr: g }, { a: acc, cr: g }] });

/* hosted storage for the ledger: one chart document per trust, one journal document per trust year */
const ledgerDirty = new Map();
let ledgerDeletes = [], ledgerTimer = null, ledgerBusy = false, me = null;
function markDirty(tr, what) { if (!tr || !tr.id) return; if (!ledgerDirty.has(tr.id)) ledgerDirty.set(tr.id, new Set()); ledgerDirty.get(tr.id).add(String(what)); }

function dropLedger(tr) { if (!tr) return; ledgerDirty.delete(tr.id); ledgerDeletes.push({ trustId: tr.id, years: [...new Set((tr.journals || []).map((j) => yearOf(j.date)))] }); }
function ledgerRef(trustId) { return db.doc("data/users/" + me + "/ledger-" + trustId); }
function scheduleLedger() {
  if (!db || !me) { ledgerDirty.clear(); ledgerDeletes = []; return; }
  if (!ledgerDirty.size && !ledgerDeletes.length) return;
  ui.save = "saving"; renderSaveBadge();
  clearTimeout(ledgerTimer); ledgerTimer = setTimeout(flushLedger, 700);
}
async function flushLedger() {
  if (ledgerBusy) { scheduleLedger(); return; }
  ledgerBusy = true; let failed = false;
  const clone = (v) => JSON.parse(JSON.stringify(v));
  try {
    while (ledgerDeletes.length) {
      const d = ledgerDeletes[0], ref = ledgerRef(d.trustId);
      for (const y of d.years) await ref.collection("years").doc(String(y)).delete();
      await ref.delete(); ledgerDeletes.shift();
    }
    for (const [tid, set] of [...ledgerDirty]) {
      const tr = liveState.trusts.find((t) => t.id === tid); if (!tr) { ledgerDirty.delete(tid); continue; }
      const ref = ledgerRef(tid);
      for (const what of [...set]) {
        if (what === "chart") await ref.set({ trustId: tid, trustName: tr.name, seq: tr.ledgerSeq || 0, accounts: clone(tr.accounts), updatedAt: new Date().toISOString(), version: 1 });
        else {
          const y = Number(what), js = tr.journals.filter((j) => yearOf(j.date) === y).sort((a, b) => a.date.localeCompare(b.date)), doc = ref.collection("years").doc(String(y));
          if (js.length) await doc.set({ trustId: tid, year: y, journals: clone(js), updatedAt: new Date().toISOString() }); else await doc.delete();
        }
        set.delete(what);
      }
      if (!set.size) ledgerDirty.delete(tid);
    }
  } catch (e) { failed = true; }
  ledgerBusy = false;
  if (failed) { ui.save = "error"; renderSaveBadge(); clearTimeout(ledgerTimer); ledgerTimer = setTimeout(flushLedger, 5000); return; }
  if (ledgerDirty.size || ledgerDeletes.length) { flushLedger(); return; }
  if (ui.save !== "error") { ui.save = "saved"; renderSaveBadge(); }
}

      loaded.trusts = loaded.trusts.filter((t) => !t.example);
      ledgerDirty.clear();
      for (const t of loaded.trusts) await loadLedger(t);
      loaded.currentId = (loaded.trusts.find((t) => t.id === loaded.currentId) || loaded.trusts[0] || {}).id || null;
      liveState = loaded; if (ui.mode === "live") state = liveState;
    }
    ui.save = "saved"; scheduleLedger(); renderSaveBadge();
    render();
  } catch (e) { db = null; me = null; docRef = null; ui.save = "local"; renderSaveBadge(); }
  finally { const was = ui.ready; ui.ready = true; if (!was && ui.route !== "home") render(); }
}
window.__hwReconnect = () => { ui.ready = false; return connect(); };
connect();
})();
